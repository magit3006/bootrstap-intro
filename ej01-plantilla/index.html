<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio 1 · Plantilla Bootstrap</title>

  <!-- ============================================================
       EJERCICIO 1 · Plantilla inicial
       ============================================================
       PASO 2a: añade aquí la etiqueta <meta name="viewport" ...>
       PASO 2b: añade aquí el <link> al CSS de Bootstrap (CDN)
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>
<body>

  <!-- PASO 2c: escribe aquí un contenedor con un título, un párrafo y un botón -->
  <div class="container py-5 text-center">
    <h1 class="display-4 fw-bold text-primary mb-3">¡Hola, Bootstrap 5!</h1>
    <p class="lead text-secondary mb-4">Esta es mi primera plantilla creada con Bootstrap 5 en el módulo de Diseño de Interfaces Web.</p>
    <button type="button" class="btn btn-primary btn-lg shadow-sm">Mi primer botón</button>
  </div>

  <!-- PASO 2d: añade aquí el <script> del JS de Bootstrap (bundle) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- PASO 4: comenta el <link> del CSS (Ctrl + /), guarda y observa qué cambia -->
  <!-- PASO 5: DevTools (F12) → Network → recarga y busca los archivos de Bootstrap -->

  <div class="container text-center mt-4">
    <p><a href="../index.html" class="btn btn-outline-secondary btn-sm">← Volver al índice</a></p>
  </div>
</body>
</html>
